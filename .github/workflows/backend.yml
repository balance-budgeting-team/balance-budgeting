name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: balance
          POSTGRES_PASSWORD: balance
          POSTGRES_DB: balance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balance -d balance_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Integration tests never skip in CI: they run against this PostgreSQL service.
      TEST_DATABASE_URL: postgresql+psycopg://balance:balance@localhost:5432/balance_test
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and pinned development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run unit and PostgreSQL integration tests
        run: pytest
